<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img"><title>Dua jalur data: Realtime Database dan Firestore</title><desc>Wemos mengirim sensor tiap 5-10 detik ke Realtime Database untuk layar realtime, dan rekaman tiap 15-30 menit ke Firestore untuk grafik historis.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="899" height="399" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="30.0" y="110.0" width="150.0" height="170.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="184.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Wemos</text><text x="105.0" y="206.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">sensor + pompa</text><rect x="290.0" y="30.0" width="280.0" height="92.0" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="430.0" y="55.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Realtime Database</text><text x="430.0" y="76.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">.../devices/WMS-001/sensor</text><text x="430.0" y="96.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central" font-style="italic">keadaan SAAT INI, ditimpa terus</text><rect x="290.0" y="262.0" width="280.0" height="92.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="430.0" y="287.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Cloud Firestore</text><text x="430.0" y="308.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">.../devices/WMS-001/readings/{id}</text><text x="430.0" y="328.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central" font-style="italic">RIWAYAT, terus bertambah</text><rect x="680.0" y="44.0" width="190.0" height="64.0" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="775.0" y="65.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">Layar realtime</text><text x="775.0" y="87.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993556" text-anchor="middle" dominant-baseline="central">Beranda · gauge Monitoring</text><rect x="680.0" y="276.0" width="190.0" height="64.0" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="775.0" y="297.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">Grafik historis</text><text x="775.0" y="319.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993556" text-anchor="middle" dominant-baseline="central">hari ini · 7 hari · 30 hari</text><line x1="182.0" y1="170.0" x2="288.0" y2="90.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="191.6" y="115.0" width="86.8" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="235.0" y="124.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">tiap 5–10 dtk</text><line x1="182.0" y1="222.0" x2="288.0" y2="300.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="185.4" y="261.0" width="99.2" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="235.0" y="270.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">tiap 15–30 mnt</text><line x1="572.0" y1="76.0" x2="678.0" y2="76.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="600.0" y="49.0" width="50.1" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="625.0" y="58.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">stream</text><line x1="572.0" y1="308.0" x2="678.0" y2="308.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="586.0" y="281.0" width="78.1" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="625.0" y="290.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">kueri waktu</text>