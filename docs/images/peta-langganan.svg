<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img"><title>Peta langganan provider per pengguna</title><desc>AuthProvider memberi uid ke empat provider data; DeviceProvider memberi deviceId ke SensorProvider dan WateringProvider.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="899" height="449" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="350.0" y="24.0" width="200.0" height="60.0" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="450.0" y="43.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">AuthProvider</text><text x="450.0" y="65.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">uid pengguna yang login</text><rect x="40.0" y="160.0" width="190.0" height="62.0" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="135.0" y="180.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Device</text><text x="135.0" y="202.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">RTDB · devices</text><rect x="250.0" y="160.0" width="190.0" height="62.0" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="345.0" y="180.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sa