"400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">deviceId</text><rect x="40.0" y="404.0" width="14.0" height="14.0" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="62.0" y="411.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">Realtime Database</text><rect x="206.0" y="404.0" width="14.0" height="14.0" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="228.0" y="411.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">Firestore</text><text x="740.0" y="340.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">login: setUser(uid), mulai berlangganan</text><text x="740.0" y="362.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">logout: setUser(null), batalkan dan kosongkan</text></svg>
