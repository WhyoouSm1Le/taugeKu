<svg xmlns="http://www.w3.org/2000/svg" width="800" height="607" viewBox="0 0 800 607" role="img"><title>Alur grafik riwayat</title><desc>Memilih rentang 7 hari membuat SensorProvider membuat kueri baru ke Firestore, meringkas data, lalu grafik digambar ulang.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="799" height="606" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="32.0" y="24.0" width="166.0" height="48.0" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="115.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">Layar</text><text x="115.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993556" text-anchor="middle" dominant-baseline="central">MonitorScreen</text><line x1="115.0" y1="74.0" x2="115.0" y2="557.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="222.0" y="24.0" width="166.0" height="48.0" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="305.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Provider</text><text x="305.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">SensorProvider</text><line x1="305.0" y1="74.0" x2="305.0" y2="557.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="412.0" y="24.0" width="166.0" height="48.0" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="495.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Service</text><text x="495.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">SensorService</text><line x1="495.0" y1="74.0" x2="495.0" y2="557.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="602.0" y="24.0" width="166.0" height="48.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="685.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Firestore</text><text x="685.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">readings</text><line x1="685.0" y1="74.0" x2="685.0" y2="557.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><text x="210.0" y="88.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">1. pilih "7 hari":</text><text x="210.0" y="103.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">setRange(week)</text><line x1="118.0" y1="117.0" x2="302.0" y2="117.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="305.0,145.0 339.0,145.0 339.0,169.0 308.0,169.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="343.0" y="142.0" width="211.1" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="347.0" y="151.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">2. batalkan langganan lama, buat</text><rect x="343.0" y="158.0" width="80.6" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="347.0" y="167.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   kueri baru</text><text x="400.0" y="203.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">3. watchReadings(since: 7 hari</text><text x="400.0" y="218.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">lalu)</text><line x1="308.0" y1="232.0" x2="492.0" y2="232.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="590.0" y="258.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">4. createdAt ≥ awal, desc,</text><text x="590.0" y="273.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">limit 500</text><line x1="498.0" y1="287.0" x2="682.0" y2="287.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="590.0" y="313.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">5. snapshot dokumen readings</text><line x1="682.0" y1="327.0" x2="498.0" y2="327.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="400.0" y="353.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">6. List&lt;SensorReading&gt;</text><line x1="492.0" y1="367.0" x2="308.0" y2="367.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="305.0,395.0 339.0,395.0 339.0,419.0 308.0,419.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="343.0" y="392.0" width="191.3" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="347.0" y="401.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">7. balik urutan (lama ke baru),</text><rect x="343.0" y="408.0" width="115.5" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="347.0" y="417.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   ringkas ≤ 8 titik</text><text x="210.0" y="453.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">8. notifyListeners()</text><line x1="302.0" y1="467.0" x2="118.0" y2="467.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="115.0,495.0 149.0,495.0 149.0,519.0 118.0,519.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="153.0" y="492.0" width="207.1" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="157.0" y="501.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">9. SensorLineChart menggambar</text><rect x="153.0" y="508.0" width="90.4" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="157.0" y="517.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   ulang kurva</text><text x="400.0" y="591.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Memilih rentang hanya mengganti kueri; datanya di Firestore tidak berubah.</text></svg>
