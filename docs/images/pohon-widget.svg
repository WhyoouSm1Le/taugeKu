e x1="350.0" y1="76.0" x2="350.0" y2="114.0" stroke="#6b7280" stroke-width="1.5" fill="none"/><polyline points="350.0,170.0 350.0,193.0 155.0,193.0 155.0,214.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round"/><polyline points="350.0,170.0 350.0,193.0 430.0,193.0 430.0,214.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round"/><polyline points="430.0,270.0 430.0,293.0 355.0,293.0 355.0,314.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round"/><polyline points="430.0,270.0 430.0,293.0 525.0,293.0 525.0,314.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round"/><rect x="24.0" y="28.0" width="14.0" height="14.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="46.0" y="35.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">penyusun (layout)</text><rect x="24.0" y="52.0" width="14.0" height="14.0" rx="3" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="46.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">isi (teks, ikon)</text><text x="350.0" y="398.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Layar = kotak di dalam kotak. Saat data berubah, Flutter menggambar ulang widget yang terkait.</text></svg>
