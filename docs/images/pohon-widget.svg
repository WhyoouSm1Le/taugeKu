<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img"><title>Pohon widget Flutter</title><desc>Scaffold berisi Column. Column berisi Text dan Row. Row berisi Icon dan Text.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="699" height="419" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="250.0" y="20.0" width="200.0" height="54.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="350.0" y="36.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Scaffold</text><text x="350.0" y="58.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">halaman</text><rect x="250.0" y="116.0" width="200.0" height="54.0" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="350.0" y="132.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Column</text><text x="350.0" y="154.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">susunan vertikal</text><rect x="70.0" y="216.0" width="170.0" height="54.0" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="155.0" y="232.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#72243E" text-anchor="