<svg xmlns="http://www.w3.org/2000/svg" width="900" height="552" viewBox="0 0 900 552" role="img"><title>Alur program Wemos</title><desc>Setup: WiFi, NTP, login Firebase, baca config. Loop: kirim sensor ke RTDB, cek perintah siram, rekaman Firestore, jadwal otomatis, dan perbarui token.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="899" height="551" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="30.0" y="26.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">setup()</text><rect x="30.0" y="44.0" width="180.0" height="46.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="120.0" y="67.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Sambung WiFi</text><line x1="212.0" y1="67.0" x2="240.0" y2="67.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="242.0" y="44.0" width="180.0" height="46.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="332.0" y="67.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Sinkron jam (NTP)</text><line x1="424.0" y1="67.0" x2="452.0" y2="67.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="454.0" y="44.0" width="180.0" height="46.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="544.0" y="67.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Login Firebase</text><line x1="636.0" y1="67.0" x2="664.0" y2="67.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="666.0" y="44.0" width="180.0" height="46.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="756.0" y="67.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Baca config</text><rect x="20.0" y="120.0" width="860.0" height="380.0" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/><text x="36.0" y="142.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">loop()</text><rect x="36.0" y="160.0" width="170.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="178.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">tiap 5–10 dtk</text><line x1="208.0" y1="178.0" x2="232.0" y2="178.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="240.0" y="178.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">baca sensor, lalu PATCH ke RTDB (isOnline = true)</text><rect x="747.3" y="167.0" width="120.7" height="22.0" rx="11.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="807.6" y="178.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">RTDB · .../sensor</text><rect x="36.0" y="222.0" width="170.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="240.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">tiap 3–5 dtk</text><line x1="208.0" y1="240.0" x2="232.0" y2="240.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="240.0" y="240.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">baca command: bila pending dan belum basi, nyalakan</text><text x="240.0" y="258.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">pompa. Selesai: status = done/failed, PUT lastWatering,</text><text x="240.0" y="276.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">POST activities dan notifications</text><rect x="728.5" y="229.0" width="139.5" height="22.0" rx="11.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="798.3" y="240.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">RTDB · .../command</text><rect x="36.0" y="312.0" width="170.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="330.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">tiap 15–30 mnt</text><line x1="208.0" y1="330.0" x2="232.0" y2="330.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="240.0" y="330.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">POST rekaman sensor terjadwal</text><rect x="711.0" y="319.0" width="157.0" height="22.0" rx="11.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="789.5" y="330.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Firestore · .../readings</text><rect x="36.0" y="374.0" width="170.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="392.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">sesuai config</text><line x1="208.0" y1="392.0" x2="232.0" y2="392.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="240.0" y="392.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">siram otomatis menurut autoWateringTimes, catat seperti di</text><text x="240.0" y="410.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">atas dengan source = "auto"</text><rect x="708.9" y="381.0" width="159.1" height="22.0" rx="11.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="788.4" y="392.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">RTDB · .../lastWatering</text><rect x="36.0" y="436.0" width="170.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="454.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">tiap ±50 mnt</text><line x1="208.0" y1="454.0" x2="232.0" y2="454.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="240.0" y="454.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">perbarui token login (ID token berlaku ± 1 jam)</text><rect x="763.3" y="443.0" width="104.7" height="22.0" rx="11.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/><text x="815.6" y="454.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">Firebase Auth</text><text x="450.0" y="530.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Kirim terlalu sering menghabiskan kuota gratis Firebase; ikuti interval yang disarankan.</text></svg>
