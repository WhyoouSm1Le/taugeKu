<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img"><title>Status perintah siram</title><desc>App membuat perintah dengan status pending. Wemos mengubahnya menjadi done atau failed. Jika 30 detik tanpa jawaban, aplikasi menulis timeout.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="819" height="329" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="58.0" y="140.0" width="22.0" height="22.0" rx="11" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="69.0" y="182.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">App membuat</text><text x="69.0" y="198.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">perintah</text><line x1="82.0" y1="151.0" x2="118.0" y2="151.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="120.0" y="116.0" width="150.0" height="70.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="195.0" y="140.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">pending</text><text x="195.0" y="162.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">menunggu Wemos</text><rect x="540.0" y="40.0" width="200.0" height="60.0" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="640.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">done</text><text x="640.0" y="81.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">ditulis oleh Wemos</text><line x1="272.0" y1="151.0" x2="538.0" y2="70.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="366.8" y="101.5" width="96.3" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="415.0" y="110.5" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">Wemos sukses</text><rect x="540.0" y="121.0" width="200.0" height="60.0" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="640.0" y="140.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">failed</text><text x="640.0" y="162.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">ditulis oleh Wemos</text><line x1="272.0" y1="151.0" x2="538.0" y2="151.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="370.5" y="142.0" width="88.9" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="415.0" y="151.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">Wemos gagal</text><rect x="540.0" y="232.0" width="200.0" height="60.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="640.0" y="251.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">timeout</text><text x="640.0" y="273.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ditulis oleh aplikasi</text><line x1="272.0" y1="151.0" x2="538.0" y2="262.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="345.4" y="197.5" width="139.1" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="415.0" y="206.5" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">30 dtk tanpa jawaban</text><text x="410.0" y="312.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Node command hanya menyimpan perintah terakhir; perintah baru menimpa yang lama.</text></svg>
