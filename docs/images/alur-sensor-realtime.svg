Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">4. emit List&lt;DeviceModel&gt;</text><line x1="463.0" y1="257.0" x2="633.0" y2="257.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="636.0,285.0 670.0,285.0 670.0,309.0 639.0,309.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="674.0" y="282.0" width="215.9" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="678.0" y="291.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">5. _devices = list, notifyListeners()</text><text x="724.0" y="335.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">6. memberi tahu pendengar</text><line x1="639.0" y1="349.0" x2="809.0" y2="349.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="812.0,377.0 778.0,377.0 778.0,401.0 809.0,401.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="548.3" y="374.0" width="225.7" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="770.0" y="383.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="end" dominant-baseline="central">7. build() ulang: Beranda dan gauge</text><rect x="624.1" y="390.0" width="149.9" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="770.0" y="399.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="end" dominant-baseline="central">   menampilkan 30.1 °C</text><text x="460.0" y="473.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Tidak ada tombol refresh: aliran (stream) terus mengalir selama pengguna login.</text></svg>
