<svg xmlns="http://www.w3.org/2000/svg" width="920" height="750" viewBox="0 0 920 750" role="img"><title>Alur tombol Siram</title><desc>Dari tap tombol Siram, perintah ditulis ke node command di Realtime Database, Wemos menyalakan pompa lalu menjawab done, dan layar menampilkan toast.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="919" height="749" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="32.0" y="24.0" width="152.0" height="48.0" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="108.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">Layar</text><text x="108.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993556" text-anchor="middle" dominant-baseline="central">DashboardScreen</text><line x1="108.0" y1="74.0" x2="108.0" y2="700.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="208.0" y="24.0" width="152.0" height="48.0" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="284.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Provider</text><text x="284.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">WateringProvider</text><line x1="284.0" y1="74.0" x2="284.0" y2="700.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="384.0" y="24.0" width="152.0" height="48.0" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="460.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Service</text><text x="460.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">WateringService</text><line x1="460.0" y1="74.0" x2="460.0" y2="700.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="560.0" y="24.0" width="152.0" height="48.0" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="636.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">RTDB</text><text x="636.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">node command</text><line x1="636.0" y1="74.0" x2="636.0" y2="700.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="736.0" y="24.0" width="152.0" height="48.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="812.0" y="37.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Wemos</text><text x="812.0" y="59.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">pompa + sensor</text><line x1="812.0" y1="74.0" x2="812.0" y2="700.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/><text x="196.0" y="88.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">1. onPressed →</text><text x="196.0" y="103.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">startWatering()</text><line x1="111.0" y1="117.0" x2="281.0" y2="117.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="284.0,145.0 318.0,145.0 318.0,169.0 287.0,169.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="322.0" y="142.0" width="203.5" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="326.0" y="151.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">2. cek: online? tersambung? lalu</text><rect x="322.0" y="158.0" width="129.2" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="326.0" y="167.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   isWatering = true,</text><rect x="322.0" y="174.0" width="117.5" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="326.0" y="183.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   notifyListeners()</text><text x="372.0" y="221.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">3. requestWatering(...)</text><line x1="287.0" y1="235.0" x2="457.0" y2="235.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="548.0" y="261.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">4. set command: pending</text><line x1="463.0" y1="275.0" x2="633.0" y2="275.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="724.0" y="301.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">5. onValue: pending</text><line x1="639.0" y1="315.0" x2="809.0" y2="315.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="812.0,343.0 778.0,343.0 778.0,367.0 809.0,367.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="590.5" y="340.0" width="183.5" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="770.0" y="349.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="end" dominant-baseline="central">6. cek umur perintah, pompa</text><rect x="660.5" y="356.0" width="113.5" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="770.0" y="365.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="end" dominant-baseline="central">   menyala 10 dtk</text><text x="724.0" y="401.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">7. status = done, isi</text><text x="724.0" y="416.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">lastWatering</text><line x1="809.0" y1="430.0" x2="639.0" y2="430.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="548.0" y="456.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">8. onValue: status = done</text><line x1="633.0" y1="470.0" x2="463.0" y2="470.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="372.0" y="496.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">9. hasil: done</text><line x1="457.0" y1="510.0" x2="287.0" y2="510.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="284.0,538.0 318.0,538.0 318.0,562.0 287.0,562.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="322.0" y="535.0" width="144.6" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="326.0" y="544.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">10. isWatering = false,</text><rect x="322.0" y="551.0" width="117.5" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="326.0" y="560.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   notifyListeners()</text><text x="196.0" y="596.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle" dominant-baseline="central">11. WateringResult.success</text><line x1="281.0" y1="610.0" x2="111.0" y2="610.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><polyline points="108.0,638.0 142.0,638.0 142.0,662.0 111.0,662.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="146.0" y="635.0" width="225.3" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="150.0" y="644.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">12. toast "Penyiraman selesai", teks</text><rect x="146.0" y="651.0" width="158.3" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="150.0" y="660.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">   "Terakhir" ikut berubah</text><text x="460.0" y="734.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Tanpa jawaban dalam 30 detik: status ditulis timeout. Saat aplikasi offline, tombol Siram ditolak sejak awal.</text></svg>
