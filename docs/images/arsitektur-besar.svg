<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img"><title>Gambaran besar arsitektur TaugeKu</title><desc>Wemos menulis ke Realtime Database dan Firestore. Aplikasi Flutter membaca keduanya dan menulis perintah ke Realtime Database. Login lewat Firebase Authentication.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="899" height="429" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="24.0" y="168.0" width="170.0" height="84.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="109.0" y="199.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Wemos D1 Mini</text><text x="109.0" y="221.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">sensor + pompa</text><rect x="340.0" y="40.0" width="230.0" height="100.0" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="455.0" y="69.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Realtime Database</text><text x="455.0" y="90.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">data SAAT INI</text><text x="455.0" y="110.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central" font-style="italic">sensor · perintah · config</text><rect x="340.0" y="270.0" width="230.0" height="100.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="455.0" y="299.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Cloud Firestore</text><text x="455.0" y="320.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">RIWAYAT &amp; arsip</text><text x="455.0" y="340.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central" font-style="italic">batch tanam · rekaman terjadwal</text><rect x="700.0" y="168.0" width="190.0" height="84.0" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="795.0" y="199.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Aplikasi</text><text x="795.0" y="221.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Flutter + Provider</text><rect x="705.0" y="300.0" width="180.0" height="64.0" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="795.0" y="321.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">Firebase Auth</text><text x="795.0" y="343.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">login pengguna</text><line x1="196.0" y1="195.0" x2="338.0" y2="105.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="216.6" y="126.0" width="86.8" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="260.0" y="135.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">tiap 5–10 dtk</text><line x1="196.0" y1="226.0" x2="338.0" y2="316.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="210.4" y="281.0" width="99.2" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="260.0" y="290.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">tiap 15–30 mnt</text><line x1="572.0" y1="105.0" x2="698.0" y2="192.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="626.1" y="131.0" width="57.9" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="655.0" y="140.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">realtime</text><line x1="572.0" y1="316.0" x2="698.0" y2="230.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="611.9" y="281.0" width="86.3" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="655.0" y="290.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">kueri riwayat</text><line x1="795.0" y1="298.0" x2="795.0" y2="254.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="776.4" y="267.0" width="37.2" height="18.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><text x="795.0" y="276.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">login</text><text x="450.0" y="405.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Aplikasi tidak pernah berbicara langsung dengan Wemos: keduanya hanya membaca dan menulis database.</text></svg>
