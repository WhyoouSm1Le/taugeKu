<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img"><title>Alur startup aplikasi</title><desc>main() menyalakan Firebase dan menjalankan TaugeKuApp. AuthGate memilih layar loading, MainShell, atau LoginScreen berdasarkan status login.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="899" height="599" rx="12" fill="#ffffff" stroke="#e5e7eb"/><rect x="350.0" y="24.0" width="200.0" height="56.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="450.0" y="41.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">main()</text><text x="450.0" y="63.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">lib/main.dart</text><line x1="450.0" y1="82.0" x2="450.0" y2="106.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="270.0" y="108.0" width="360.0" height="88.0" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="288.0" y="130.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">1. WidgetsFlutterBinding.ensureInitialized()</text><text x="288.0" y="152.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">2. Firebase.initializeApp(...)</text><text x="288.0" y="174.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" dominant-baseline="central">3. runApp(TaugeKuApp)</text><line x1="450.0" y1="198.0" x2="450.0" y2="226.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="300.0" y="228.0" width="300.0" height="60.0" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="450.0" y="247.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">TaugeKuApp</text><text x="450.0" y="269.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">lib/app.dart: MultiProvider lalu MaterialApp</text><line x1="450.0" y1="290.0" x2="450.0" y2="318.0" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="350.0" y="320.0" width="200.0" height="56.0" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="450.0" y="337.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">AuthGate</text><text x="450.0" y="359.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">membaca AuthProvider</text><rect x="30.0" y="448.0" width="230.0" height="96.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="145.0" y="475.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">isInitializing</text><text x="145.0" y="496.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">layar loading</text><text x="145.0" y="516.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-style="italic">Firebase belum menjawab</text><polyline points="450.0,378.0 450.0,412.0 145.0,412.0 145.0,446.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="335.0" y="448.0" width="230.0" height="96.0" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="450.0" y="475.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">sudah login</text><text x="450.0" y="496.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">MainShell</text><text x="450.0" y="516.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central" font-style="italic">header + halaman + navigasi bawah</text><polyline points="450.0,378.0 450.0,412.0 450.0,412.0 450.0,446.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="640.0" y="448.0" width="230.0" height="96.0" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="755.0" y="475.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">belum login</text><text x="755.0" y="496.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#993556" text-anchor="middle" dominant-baseline="central">LoginScreen</text><text x="755.0" y="516.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#993556" text-anchor="middle" dominant-baseline="central" font-style="italic">form username dan password</text><polyline points="450.0,378.0 450.0,412.0 755.0,412.0 755.0,446.0" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><text x="450.0" y="578.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central" font-style="italic">Login berhasil: isLoggedIn menjadi true, layar berganti otomatis (tanpa Navigator.push manual).</text></svg>
